<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4e8d0">
  <title>Little Dominoes · Viaan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=1">
  <script type="importmap">{"imports":{"three":"../sky-playground/vendor/three.module.js"}}</script>
</head>
<body>
  <canvas id="world" tabindex="0" aria-label="A play mat with dominoes. Drag to stand dominoes up in a line. Tap a domino, or press Enter, to knock it over."></canvas>
  <header class="topbar">
    <a class="round home" href="../index.html" aria-label="Back to Viaan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5M6 10v9.5h12V10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <span class="brand">little dominoes<span class="brand-dot">.</span></span>
    <button class="round" id="sound" aria-label="Turn sound on" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5l4.5-4v13l-4.5-4H4z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path class="wave" d="M15.5 9a4.5 4.5 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path class="mute" d="m15.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </header>

  <div class="count" id="count" hidden><b id="countText">0</b><small>knocked over</small></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="hint" id="hint" aria-hidden="true" hidden><span>👇</span></div>
  <div class="prompt" id="prompt" hidden><span class="finger" aria-hidden="true">👆</span><p>Draw a line with your finger</p></div>

  <nav class="tools" aria-label="Domino tools">
    <button id="runs" aria-label="Show me a domino run"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.4 5.6 6.1.6-4.6 4 1.4 6-5.3-3.2-5.3 3.2 1.4-6-4.6-4 6.1-.6z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><small>Show me</small></button>
    <button id="undo" aria-label="Take away the last line"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6 4.5 10.5 9 15M5 10.5h9a5.5 5.5 0 0 1 0 11h-3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><small>Undo</small></button>
    <button id="again" class="big" aria-label="Stand them all up again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.6-5.7M19.8 3.6v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><small>Stand up</small></button>
    <button id="paint" aria-label="Change the colours"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="8" r="4" fill="#f2495c"/><circle cx="16.5" cy="8" r="4" fill="#ffc93c"/><circle cx="12" cy="16" r="4" fill="#35b6e8"/></svg><small>Colours</small></button>
    <button id="clear" aria-label="Clear the mat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg><small>Clear</small></button>
  </nav>

  <dialog id="runsDialog" class="card" aria-labelledby="runsTitle">
    <h2 id="runsTitle">Pick one to knock over</h2>
    <div class="run-list" id="runList"></div>
    <p class="tally" id="tally"></p>
    <button class="secondary" id="runsClose">Not now</button>
  </dialog>

  <div class="veil" id="broken" hidden><h2>The dominoes cannot be shown here.</h2><p>This game needs 3D graphics, which this browser has turned off.</p><a class="text-link" href="../index.html">Back to Viaan</a></div>
  <noscript><p class="noscript">Please enable JavaScript to play. <a href="../index.html">Back to Viaan</a></p></noscript>
  <script type="module" src="game.js?v=1"></script>
</body>
</html>
